services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: frontier
      POSTGRES_USER: frontier
      # Reachable only on this compose network; no port is published.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U frontier
      interval: 5s
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:8090:8080
    environment:
      DATABASE_URL: postgres://frontier@db/frontier
      CORS_ORIGINS: https://theolundqvist.github.io
      GOOGLE_CLIENT_ID: 1005775847710-ikjidn8vmd30km7ae9oh3d7k4f9don7m.apps.googleusercontent.com
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on: [db]
    volumes:
      - ./backups:/backups
    entrypoint: sh -c 'while true; do pg_dump -h db -U frontier frontier | gzip > /backups/frontier-$$(date +%F).sql.gz; ls -1 /backups/*.sql.gz | head -n -14 | xargs -r rm; sleep 86400; done'
